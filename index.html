<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>README Table Viewer</title>

  <!-- DataTables -->
  <link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/jquery.dataTables.min.css" />

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Courier New', monospace;
      background: #0d1117;
      color: #e6edf3;
      min-height: 100vh;
      padding: 2rem;
    }

    header {
      margin-bottom: 2rem;
      border-bottom: 1px solid #30363d;
      padding-bottom: 1rem;
      display: flex;
      align-items: baseline;
      gap: 1rem;
    }

    header h1 {
      font-size: 1.2rem;
      font-weight: normal;
      color: #58a6ff;
      letter-spacing: 0.05em;
    }

    #source-url {
      font-size: 0.75rem;
      color: #484f58;
    }

    /* status / error */
    #status {
      padding: 1rem;
      border-radius: 6px;
      font-size: 0.85rem;
      display: none;
    }
    #status.error   { background: #2d1b1b; border: 1px solid #6e2121; color: #f85149; }
    #status.loading { background: #1b2433; border: 1px solid #1f4080; color: #58a6ff; }

    /* table wrapper */
    #table-wrap { display: none; }

    /* DataTables overrides — dark GitHub theme */
    .dataTables_wrapper {
      font-size: 0.85rem;
      color: #e6edf3;
    }

    .dataTables_filter input,
    .dataTables_length select {
      background: #161b22;
      border: 1px solid #30363d;
      color: #e6edf3;
      border-radius: 6px;
      padding: 4px 8px;
      outline: none;
      margin-left: 6px;
    }

    .dataTables_filter input:focus,
    .dataTables_length select:focus {
      border-color: #58a6ff;
      box-shadow: 0 0 0 2px rgba(88,166,255,0.2);
    }

    .dataTables_filter label,
    .dataTables_length label,
    .dataTables_info {
      color: #8b949e;
    }

    table.dataTable {
      border-collapse: collapse;
      width: 100% !important;
      margin-top: 1rem !important;
    }

    table.dataTable thead th {
      background: #161b22;
      color: #58a6ff;
      border-bottom: 2px solid #30363d;
      padding: 10px 14px;
      text-align: left;
      cursor: pointer;
      user-select: none;
      white-space: nowrap;
      letter-spacing: 0.03em;
    }

    table.dataTable thead th:hover { background: #1f2937; }

    /* sort arrows */
    table.dataTable thead .sorting::after,
    table.dataTable thead .sorting_asc::after,
    table.dataTable thead .sorting_desc::after {
      color: #484f58;
    }
    table.dataTable thead .sorting_asc::after  { color: #58a6ff; }
    table.dataTable thead .sorting_desc::after { color: #58a6ff; }

    table.dataTable tbody tr {
      border-bottom: 1px solid #21262d;
      transition: background 0.1s;
    }
    table.dataTable tbody tr:hover { background: #1c2128; }
    table.dataTable tbody td {
      padding: 9px 14px;
      vertical-align: middle;
    }

    /* striping */
    table.dataTable tbody tr:nth-child(even) { background: #0d1117; }
    table.dataTable tbody tr:nth-child(odd)  { background: #161b22; }
    table.dataTable tbody tr:hover           { background: #1c2128 !important; }

    .dataTables_paginate .paginate_button {
      background: #161b22;
      border: 1px solid #30363d !important;
      color: #e6edf3 !important;
      border-radius: 6px;
      padding: 4px 10px;
      cursor: pointer;
      margin: 0 2px;
    }
    .dataTables_paginate .paginate_button:hover {
      background: #1f2937 !important;
      color: #58a6ff !important;
    }
    .dataTables_paginate .paginate_button.current {
      background: #1f4080 !important;
      color: #58a6ff !important;
      border-color: #58a6ff !important;
    }
    .dataTables_paginate .paginate_button.disabled {
      opacity: 0.3;
      cursor: default;
    }

    .dataTables_wrapper .dataTables_info { margin-top: 0.6rem; }
  </style>
</head>
<body>

<header>
  <h1>📄 README table viewer</h1>
  <span id="source-url"></span>
</header>

<div id="status"></div>

<div id="table-wrap">
  <table id="data-table" class="display" style="width:100%"></table>
</div>

<script>
  const README_URL = "https://raw.githubusercontent.com/THX81/LlamaCppBench/main/README.md";
</script>
<!-- ═══════════════════════════════════════════════ -->

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>

<script>
(function () {

  const statusEl  = document.getElementById("status");
  const tableWrap = document.getElementById("table-wrap");
  const sourceEl  = document.getElementById("source-url");

  function showStatus(msg, type) {
    statusEl.textContent = msg;
    statusEl.className   = type;
    statusEl.style.display = "block";
  }

  // ── Markdown table parser ────────────────────────────────────────────────
  // Finds the FIRST markdown table in the text and returns { headers, rows }
  function parseMarkdownTable(md) {
    const lines = md.split("\n");

    let tableStart = -1;

    // Find first line that looks like a table row (starts/ends with |)
    for (let i = 0; i < lines.length; i++) {
      if (/^\s*\|.+\|\s*$/.test(lines[i])) {
        tableStart = i;
        break;
      }
    }

    if (tableStart === -1) return null;

    // Collect contiguous table lines
    const tableLines = [];
    for (let i = tableStart; i < lines.length; i++) {
      if (/^\s*\|.+\|\s*$/.test(lines[i])) {
        tableLines.push(lines[i]);
      } else if (tableLines.length > 0) {
        break; // table ended
      }
    }

    if (tableLines.length < 2) return null; // need at least header + separator

    // Split a row into cells
    const splitRow = (line) =>
      line.split("|")
          .slice(1, -1)               // drop empty first/last from leading/trailing |
          .map(cell => cell.trim());

    const headers = splitRow(tableLines[0]);

    // Line 1 is the separator (---|---|---), skip it
    // Remaining lines are data rows
    const rows = tableLines.slice(2).map(splitRow);

    return { headers, rows };
  }

  // ── Main ─────────────────────────────────────────────────────────────────
  async function init() {
    sourceEl.textContent = README_URL;
    showStatus("Fetching README.md…", "loading");

    let md;
    try {
      const res = await fetch(README_URL);
      if (!res.ok) throw new Error(`HTTP ${res.status} ${res.statusText}`);
      md = await res.text();
    } catch (err) {
      showStatus(`Failed to fetch README: ${err.message}`, "error");
      return;
    }

    const table = parseMarkdownTable(md);

    if (!table) {
      showStatus("No markdown table found in README.md", "error");
      return;
    }

    statusEl.style.display = "none";
    tableWrap.style.display = "block";

    // Build DataTables columns + data
    const columns = table.headers.map(h => ({ title: h }));
    const data    = table.rows;

    $("#data-table").DataTable({
      columns,
      data,
      pageLength: 25,
      order: [],            // no default sort — keep README order
      language: {
        search:       "Filter:",
        lengthMenu:   "Show _MENU_ rows",
        info:         "_START_–_END_ of _TOTAL_ rows",
        infoEmpty:    "No rows",
        zeroRecords:  "No matching rows found",
      }
    });
  }

  init();
})();
</script>

</body>
</html>
